name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest
    env:
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID) in repository secrets to deploy via GitHub Actions, or connect Cloudflare Workers Builds directly."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cf.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.configured == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install & build
        if: steps.cf.outputs.configured == 'true'
        run: |
          npm ci
          npm run build
      - name: Deploy with Wrangler
        if: steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
