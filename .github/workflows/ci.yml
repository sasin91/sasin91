name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    name: Check, Build & Deploy
    runs-on: ubuntu-latest
    env:
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID) in repository secrets to enable deploys and PR previews."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload PR preview to Cloudflare Workers
        id: preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          OUTPUT=$(npx wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --tag "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} (${GITHUB_SHA:0:7})" 2>&1)
          echo "$OUTPUT"

          ALIAS_URL=$(echo "$OUTPUT" | grep -oE 'https://pr-[0-9]+-[^ ]+\.workers\.dev' | head -n 1 || true)
          VERSION_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-f0-9-]+-[^ ]+\.workers\.dev' | head -n 1 || true)

          echo "alias_url=$ALIAS_URL" >> "$GITHUB_OUTPUT"
          echo "version_url=$VERSION_URL" >> "$GITHUB_OUTPUT"

          {
            echo "### Cloudflare Workers Preview (PR #${PR_NUMBER})"
            [ -n "$ALIAS_URL" ] && echo "- **Preview URL:** $ALIAS_URL"
            [ -n "$VERSION_URL" ] && echo "- **Version URL:** $VERSION_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with preview URL
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.cf.outputs.configured == 'true' &&
          (steps.preview.outputs.alias_url != '' || steps.preview.outputs.version_url != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALIAS_URL: ${{ steps.preview.outputs.alias_url }}
          VERSION_URL: ${{ steps.preview.outputs.version_url }}
        run: |
          set -euo pipefail
          MARKER="<!-- cloudflare-preview -->"
          BODY=$(cat <<EOF
          ${MARKER}
          ### Preview deployment ready
          ${ALIAS_URL:+- **Preview URL:** ${ALIAS_URL}}
          ${VERSION_URL:+- **Commit URL:** ${VERSION_URL}}
          EOF
          )

          COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n 1 || true)

          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
          fi

      - name: Deploy production with Wrangler
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
