name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test

  deploy:
    name: Build and deploy
    needs: check
    runs-on: ubuntu-latest
    # workflow_dispatch can be run against any ref from the Actions UI; without
    # this guard a manual run on a feature branch would still rsync --delete
    # that branch's public/ over the live site.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the site
        run: cargo run --release

      - name: Fail if any JavaScript slipped in
        run: |
          count=$(grep -ro '<script' public --include=*.html | wc -l)
          echo "script tags: $count"
          test "$count" -eq 0

      - name: Fail if a required URL is missing
        run: |
          for u in index about/index blog/index blog/trongate/index \
                   blog/trongate/mx-transition/index \
                   blog/freebsd-on-hetzner/index blog/athletos-freebsd/index; do
            test -f "public/$u.html" || { echo "missing: $u"; exit 1; }
          done
          echo "all required URLs present"

      # Until the box is provisioned there is nowhere to send this. Skipping
      # loudly beats failing every push: a permanently red pipeline is one you
      # stop reading, and the build and its guards above are the part that
      # actually protects the live site.
      - name: Is a deploy target configured?
        id: target
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::The site built and passed its guards, but DEPLOY_HOST/DEPLOY_USER are not set, so there is nowhere to publish it yet."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add the host key
        if: steps.target.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # Deploys land in a new release directory and go live by moving a symlink,
      # rather than by mutating the tree Caddy is serving. Two reasons:
      #
      #   * Atomic. `rsync --delete` straight into the live root leaves a window
      #     where a visitor gets new HTML referencing a stylesheet that has not
      #     landed yet. A symlink swap has no such window.
      #   * Reversible. Rolling back is re-pointing the symlink at the previous
      #     release, not rebuilding and re-pushing an old commit.
      #
      # --link-dest hardlinks unchanged files from the previous release, so the
      # 2.4 MB video costs nothing on the wire or on disk after the first deploy.
      - name: Deploy a new release
        if: steps.target.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          ROOT: /usr/local/www/sasin91.xyz
        run: |
          set -euo pipefail
          REL="r$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          echo "release: $REL"

          PREV=$(ssh -o BatchMode=yes "$HOST" "readlink $ROOT/current 2>/dev/null || true")
          LINK_DEST=""
          if [ -n "$PREV" ]; then
            echo "hardlinking unchanged files from $PREV"
            LINK_DEST="--link-dest=$ROOT/$PREV"
          fi

          rsync -az --delete $LINK_DEST \
            -e "ssh -o BatchMode=yes" \
            public/ "$HOST:$ROOT/releases/$REL/"

          # ln -sfn is not atomic — it unlinks before it links. Creating the new
          # link under a temporary name and renaming it over the old one is, and
          # `mv -h` moves the symlink itself rather than following it.
          ssh -o BatchMode=yes "$HOST" "
            set -e
            ln -sfn 'releases/$REL' '$ROOT/current.tmp'
            mv -h '$ROOT/current.tmp' '$ROOT/current'
            echo \"current -> \$(readlink '$ROOT/current')\"
          "

      - name: Prune old releases, keeping the last three
        if: steps.target.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          ROOT: /usr/local/www/sasin91.xyz
        run: |
          # Release names sort chronologically, so a reverse sort is newest
          # first. FreeBSD's head has no negative count and its xargs has no -r,
          # hence the loop.
          ssh -o BatchMode=yes "$HOST" "
            cd '$ROOT/releases'
            ls -1 | sort -r | tail -n +4 | while read -r old; do
              echo \"pruning \$old\"
              rm -rf \"\$old\"
            done
            echo 'kept:'; ls -1 | sort -r
          "

      - name: Verify the deployed site
        if: steps.target.outputs.configured == 'true'
        run: |
          set -euo pipefail
          fail=0
          for path in / /blog /blog/trongate /blog/trongate/mx-transition \
                      /blog/freebsd-on-hetzner /blog/athletos-freebsd /about/ /rss.xml; do
            # 308 is expected on the extensionless paths: Caddy canonicalises to
            # the trailing-slash form, which browsers and crawlers follow.
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "https://sasin91.xyz$path")
            printf '%-40s %s\n' "$path" "$code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
