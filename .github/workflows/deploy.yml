name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test

  deploy:
    name: Build and deploy
    needs: check
    runs-on: ubuntu-latest
    # workflow_dispatch can be run against any ref from the Actions UI; without
    # this guard a manual run on a feature branch would still rsync --delete
    # that branch's public/ over the live site.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the site
        run: cargo run --release

      # /cv/ is the source of truth (rendered from content/cv.toml); this
      # generates public/cv.pdf from the same HTML and print stylesheet, so
      # there is one layout to maintain, not two. Runs before the guards
      # below so a broken render fails the build instead of shipping.
      # `npx serve -s` is SPA mode: it rewrites every unmatched route to
      # /index.html. /cv/ therefore returned the HOMEPAGE, and cv.pdf shipped
      # as a snapshot of the landing page for several deploys. `test -s` could
      # not catch it (the file existed and was non-empty) and neither could
      # `test -f public/cv/index.html` (that checks disk, not what the server
      # answered). python3's http.server resolves directories honestly, and
      # the assertions below check the bytes rather than trusting the plumbing.
      - name: Render the CV to PDF
        run: |
          set -euo pipefail
          sudo apt-get install -qq -y poppler-utils >/dev/null

          python3 -m http.server 8123 --directory public &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/cv/ >/dev/null && break
            sleep 1
          done

          # Prove the server is serving the CV, not falling back to something.
          curl -sf http://127.0.0.1:8123/cv/ | grep -q 'Experience'             || { echo "/cv/ did not serve the CV page"; exit 1; }

          google-chrome --headless --disable-gpu --no-sandbox             --print-to-pdf=public/cv.pdf --no-pdf-header-footer             http://127.0.0.1:8123/cv/

          test -s public/cv.pdf

          # And prove the PDF is the CV. This is the check that was missing.
          pdftotext public/cv.pdf - > /tmp/cv.txt
          for needle in Experience Skills Education; do
            grep -q "$needle" /tmp/cv.txt               || { echo "cv.pdf is missing '$needle' - it is not the CV"; exit 1; }
          done
          grep -q 'Trongate PHP' /tmp/cv.txt             && { echo "cv.pdf contains blog posts - it rendered the homepage"; exit 1; }
          echo "cv.pdf verified as the CV ($(wc -c < public/cv.pdf) bytes)"

      - name: Fail if unexpected JavaScript slipped in
        run: |
          set -euo pipefail

          # An external script is the thing that would genuinely gate reading:
          # a CDN that is slow, blocked or gone takes the page with it.
          #
          # grep exits 1 when it finds no matches -- which is the PASSING case
          # here (zero external scripts). Under `set -o pipefail` that exit
          # code propagates through the pipe to `wc -l`, and `set -e` then
          # kills the step before the echo below ever runs, so the guard
          # aborted silently on every green build. `|| true` neutralises that
          # so a real match count (including zero) reaches `wc -l`.
          external=$({ grep -ro '<script[^>]*src=' public --include=*.html || true; } | wc -l)
          echo "external scripts: $external"
          if [ "$external" -ne 0 ]; then
            grep -ro '<script[^>]*src=[^>]*>' public --include=*.html
            echo "no external scripts are allowed"
            exit 1
          fi

          # Every page carries the two theme scripts; a post page carries a
          # third for the diagram lightbox. Anything else means a script
          # arrived without anyone deciding to add it.
          fail=0
          while IFS= read -r page; do
            # Same grep-exits-1-on-no-match trap as above: a page that lost
            # both its toggle scripts (n=0) is exactly the failure this loop
            # exists to catch, and without `|| true` it would abort here
            # before ever reporting that.
            n=$({ grep -o '<script' "$page" || true; } | wc -l)
            if grep -q 'data-lightbox' "$page"; then
              want=3
            else
              want=2
            fi
            if [ "$n" -ne "$want" ]; then
              echo "$page has $n inline scripts, expected $want"
              fail=1
            fi
          done < <(find public -name '*.html')
          test "$fail" -eq 0
          echo "every page carries its expected inline scripts, and no others"

      - name: Fail if a required URL is missing
        run: |
          for u in index about/index cv/index blog/index blog/trongate/index \
                   blog/trongate/mx-transition/index \
                   blog/freebsd-on-hetzner/index blog/athletos-freebsd/index; do
            test -f "public/$u.html" || { echo "missing: $u"; exit 1; }
          done
          echo "all required URLs present"

      # Until the box is provisioned there is nowhere to send this. Skipping
      # loudly beats failing every push: a permanently red pipeline is one you
      # stop reading, and the build and its guards above are the part that
      # actually protects the live site.
      - name: Is a deploy target configured?
        id: target
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::The site built and passed its guards, but DEPLOY_HOST/DEPLOY_USER are not set, so there is nowhere to publish it yet."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add the host key
        if: steps.target.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # Deploys land in a new release directory and go live by moving a symlink,
      # rather than by mutating the tree Caddy is serving. Two reasons:
      #
      #   * Atomic. `rsync --delete` straight into the live root leaves a window
      #     where a visitor gets new HTML referencing a stylesheet that has not
      #     landed yet. A symlink swap has no such window.
      #   * Reversible. Rolling back is re-pointing the symlink at the previous
      #     release, not rebuilding and re-pushing an old commit.
      #
      # --link-dest hardlinks unchanged files from the previous release, so the
      # 2.4 MB video costs nothing on the wire or on disk after the first deploy.
      - name: Deploy a new release
        if: steps.target.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          ROOT: /usr/local/www/sasin91.xyz
        run: |
          set -euo pipefail
          REL="r$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          echo "release: $REL"

          PREV=$(ssh -o BatchMode=yes "$HOST" "readlink $ROOT/current 2>/dev/null || true")
          LINK_DEST=""
          if [ -n "$PREV" ]; then
            echo "hardlinking unchanged files from $PREV"
            LINK_DEST="--link-dest=$ROOT/$PREV"
          fi

          rsync -az --delete $LINK_DEST \
            -e "ssh -o BatchMode=yes" \
            public/ "$HOST:$ROOT/releases/$REL/"

          # ln -sfn is not atomic — it unlinks before it links. Creating the new
          # link under a temporary name and renaming it over the old one is, and
          # `mv -h` moves the symlink itself rather than following it.
          ssh -o BatchMode=yes "$HOST" "
            set -e
            ln -sfn 'releases/$REL' '$ROOT/current.tmp'
            mv -h '$ROOT/current.tmp' '$ROOT/current'
            echo \"current -> \$(readlink '$ROOT/current')\"
          "

      - name: Prune old releases, keeping the last three
        if: steps.target.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          ROOT: /usr/local/www/sasin91.xyz
        run: |
          # Release names sort chronologically, so a reverse sort is newest
          # first. FreeBSD's head has no negative count and its xargs has no -r,
          # hence the loop.
          ssh -o BatchMode=yes "$HOST" "
            cd '$ROOT/releases'
            ls -1 | sort -r | tail -n +4 | while read -r old; do
              echo \"pruning \$old\"
              rm -rf \"\$old\"
            done
            echo 'kept:'; ls -1 | sort -r
          "

      - name: Verify the deployed site
        if: steps.target.outputs.configured == 'true'
        run: |
          set -euo pipefail
          fail=0
          for path in / /blog /blog/trongate /blog/trongate/mx-transition \
                      /blog/freebsd-on-hetzner /blog/athletos-freebsd /about/ /cv/ /cv.pdf /rss.xml; do
            # 308 is expected on the extensionless paths: Caddy canonicalises to
            # the trailing-slash form, which browsers and crawlers follow.
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "https://sasin91.xyz$path")
            printf '%-40s %s\n' "$path" "$code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
