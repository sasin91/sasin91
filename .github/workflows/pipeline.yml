name: pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test
      # The Ask view's retrieval code runs in the browser, so it is tested
      # with Node's built-in runner (no npm, no dependencies). Its last tests
      # ask real questions of the built search index, hence the build first.
      - name: Build the site
        run: cargo run --release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the Ask view's retrieval
        run: node --test js/retrieval.test.mjs
