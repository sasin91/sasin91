# The AI knowledge stream: how the nodes in nodes/ are presented as one
# long-form article at /ai/, a timeline at /ai/timeline/ and a retrieval
# interface at /ai/ask/.
#
# Nodes do not carry their own position. The order of the article is the
# order the ids appear in the [[part]] lists below, so reordering the article
# is moving an id, and a node can appear in any number of learning paths
# without its file changing. See docs/knowledge-nodes.md.

path = "ai"
title = "How modern language models work"
description = "From text to tokens, attention, sampling, retrieval and tools: how a large language model turns a prompt into an answer, and what it does not do along the way."
published = 2026-10-02
updated = 2026-10-02

[[part]]
title = "From text to vectors"
nodes = ["text", "tokenization", "token-ids", "embeddings", "position"]

[[part]]
title = "Inside the transformer"
nodes = [
    "contextual-representations",
    "transformer-layers",
    "attention",
    "qkv",
    "dense-attention",
    "sparse-attention",
    "context-window",
    "kv-cache",
]

[[part]]
title = "Choosing the next token"
nodes = [
    "logits",
    "softmax",
    "sampling",
    "sampling-controls",
    "discarded-candidates",
    "search-and-verification",
]

[[part]]
title = "Bringing in outside information"
nodes = [
    "rag",
    "retrieval-vs-attention",
    "external-memory",
    "tool-use",
    "mcp",
    "code-retrieval",
]

[[part]]
title = "Learning, and what the words mean"
nodes = ["training", "synthetic-data", "self-improvement", "agi"]

# Learning paths: named routes through the same nodes. Validated at build
# time (every id must exist) but not rendered yet -- they are the extension
# point for guided lessons.

[[learning_path]]
id = "llm-generation"
title = "How an LLM generates text"
nodes = [
    "tokenization",
    "embeddings",
    "position",
    "attention",
    "kv-cache",
    "logits",
    "sampling",
]

[[learning_path]]
id = "coding-agents"
title = "How AI coding agents understand a repository"
nodes = [
    "context-window",
    "retrieval-vs-attention",
    "rag",
    "external-memory",
    "tool-use",
    "mcp",
    "code-retrieval",
]
