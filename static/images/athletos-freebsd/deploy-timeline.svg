<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Timeline of a rolling deploy: green is stopped and restarted in the first two seconds while blue keeps serving, then blue is rolled while green serves. Five seconds total, never zero healthy backends.">
  <defs>
    <linearGradient id="d-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--diagram-bg, #12121b)"/>
      <stop offset="100%" stop-color="var(--diagram-panel, #0a0a10)"/>
    </linearGradient>
    <!-- See architecture.svg for why some data stops carry a light-dark()
         pair and others (already >= 3:1 against the light panel) don't. -->
    <linearGradient id="d-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="light-dark(#0e7490, #22d3ee)"/>
    </linearGradient>
    <linearGradient id="d-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="light-dark(#047857, #10b981)"/><stop offset="100%" stop-color="light-dark(#4d7c0f, #84cc16)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#d-panel)"/>
  <rect x="0.5" y="0.5" width="1199" height="329" rx="24" fill="none" stroke="var(--diagram-rule, #ffffff)" stroke-opacity="0.08"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="48" y="48" font-size="16" fill="var(--diagram-text, #e5e7eb)">athletos-deploy v0.1.2 — rolling update</text>
    <text x="1152" y="48" text-anchor="end" font-size="16" fill="light-dark(#15803d, #4ade80)" font-weight="700">5s total</text>

    <!-- axis -->
    <line x1="180" y1="248" x2="1120" y2="248" stroke="var(--diagram-rule, #374151)" stroke-width="1"/>
    <g font-size="12" fill="var(--diagram-muted, #4b5563)">
      <text x="180" y="272" text-anchor="middle">0s</text>
      <text x="368" y="272" text-anchor="middle">1s</text>
      <text x="556" y="272" text-anchor="middle">2s</text>
      <text x="744" y="272" text-anchor="middle">3s</text>
      <text x="932" y="272" text-anchor="middle">4s</text>
      <text x="1120" y="272" text-anchor="middle">5s</text>
    </g>
    <g stroke="var(--diagram-rule, #1f2937)" stroke-width="1">
      <line x1="368" y1="96" x2="368" y2="248"/>
      <line x1="556" y1="96" x2="556" y2="248"/>
      <line x1="744" y1="96" x2="744" y2="248"/>
      <line x1="932" y1="96" x2="932" y2="248"/>
    </g>

    <!-- green row -->
    <text x="160" y="132" text-anchor="end" font-size="14" fill="light-dark(#4d7c0f, #84cc16)" font-weight="700">green</text>
    <rect x="180" y="112" width="376" height="30" rx="6" fill="var(--diagram-panel, #1f2937)"/>
    <text x="368" y="132" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #9ca3af)">stop · repoint · start · health</text>
    <rect x="556" y="112" width="564" height="30" rx="6" fill="url(#d-green)" fill-opacity="0.85"/>
    <!-- This text sits on the bar above, not the panel: the bar itself
         darkens in light mode (see d-green's stops), so the text that reads
         against it has to flip light too, or the two would collide. -->
    <text x="838" y="132" text-anchor="middle" font-size="12" fill="light-dark(#ffffff, #052e16)" font-weight="700">serving v0.1.2</text>

    <!-- blue row -->
    <text x="160" y="192" text-anchor="end" font-size="14" fill="light-dark(#0e7490, #22d3ee)" font-weight="700">blue</text>
    <rect x="180" y="172" width="376" height="30" rx="6" fill="url(#d-blue)" fill-opacity="0.85"/>
    <text x="368" y="192" text-anchor="middle" font-size="12" fill="light-dark(#ffffff, #082f49)" font-weight="700">serving previous release</text>
    <rect x="556" y="172" width="376" height="30" rx="6" fill="var(--diagram-panel, #1f2937)"/>
    <text x="744" y="192" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #9ca3af)">stop · repoint · start · health</text>
    <rect x="932" y="172" width="188" height="30" rx="6" fill="url(#d-blue)" fill-opacity="0.85"/>
    <text x="1026" y="192" text-anchor="middle" font-size="12" fill="light-dark(#ffffff, #082f49)" font-weight="700">v0.1.2</text>

    <!-- healthy-backends band -->
    <text x="160" y="228" text-anchor="end" font-size="12" fill="var(--diagram-muted, #6b7280)">healthy</text>
    <rect x="180" y="216" width="940" height="16" rx="4" fill="#052e16" stroke="#166534"/>
    <text x="650" y="228" text-anchor="middle" font-size="11" fill="#4ade80">at least one, the entire time</text>

    <text x="48" y="306" font-size="13" fill="var(--diagram-muted, #6b7280)">The health gate allows 120s and used 2. Caddy checks every 5s, so it never observed a gap at all.</text>
  </g>
</svg>
