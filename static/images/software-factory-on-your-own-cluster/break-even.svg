<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="A break-even chart. The cluster is a flat line: the same monthly cost whether it runs one sandbox-hour or a thousand. The serverless option is a line rising from the origin, charging per sandbox-hour. They cross somewhere in a band of several hundred sandbox-hours a month, drawn as a band rather than a point because euros and dollars are not converted here. Below the crossing the serverless shape is cheaper; above it the cluster is, and the cluster's flat line is also paying for ingress, certificates, GitOps, metrics, logs and traces for everything else running there.">
  <defs>
    <style>svg:root { color-scheme: dark; }</style>
    <linearGradient id="b-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--diagram-bg, #12121b)"/>
      <stop offset="100%" stop-color="var(--diagram-panel, #0a0a10)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="540" rx="24" fill="url(#b-panel)"/>
  <rect x="0.5" y="0.5" width="1199" height="539" rx="24" fill="none" stroke="var(--diagram-rule, #ffffff)" stroke-opacity="0.08"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="48" y="44" font-size="16" fill="var(--diagram-muted, #9a9aa6)">one flat line, one sloped one · the only question is how much you run</text>

    <rect x="640" y="96" width="100" height="324" fill="light-dark(#b45309, #fbbf24)" fill-opacity="0.10"/>

    <path d="M 140 90 V 420 H 1120" fill="none" stroke="var(--diagram-rule, #4b5563)" stroke-width="1.5"/>
    <text x="140" y="452" font-size="11" fill="var(--diagram-muted, #9a9aa6)">0</text>
    <text x="690" y="452" text-anchor="middle" font-size="11" fill="light-dark(#b45309, #fbbf24)">several hundred</text>
    <text x="1120" y="452" text-anchor="end" font-size="11" fill="var(--diagram-muted, #9a9aa6)">more</text>
    <text x="630" y="478" text-anchor="middle" font-size="12" fill="var(--diagram-muted, #9a9aa6)">sandbox-hours per month</text>
    <text x="128" y="255" text-anchor="end" font-size="12" fill="var(--diagram-muted, #9a9aa6)">cost</text>
    <text x="128" y="272" text-anchor="end" font-size="12" fill="var(--diagram-muted, #9a9aa6)">per month</text>

    <path d="M 140 258 H 1120" fill="none" stroke="light-dark(#5b3fd8, #a78bfa)" stroke-width="2.5"/>
    <text x="152" y="248" font-size="13" fill="light-dark(#5b3fd8, #a78bfa)" font-weight="700">your own cluster · EUR 122.45</text>
    <text x="152" y="286" font-size="11" fill="var(--diagram-muted, #9a9aa6)">flat · the same whether you run one sandbox or ten</text>

    <path d="M 140 420 L 1120 130" fill="none" stroke="light-dark(#0f766e, #5eead4)" stroke-width="2.5"/>
    <text x="880" y="188" font-size="13" fill="light-dark(#0f766e, #5eead4)" font-weight="700">serverless · about $0.22 per sandbox-hour</text>
    <text x="880" y="206" font-size="11" fill="var(--diagram-muted, #9a9aa6)">you pay for what you run, and nothing when idle</text>

    <circle cx="690" cy="258" r="6" fill="none" stroke="light-dark(#b45309, #fbbf24)" stroke-width="2"/>

    <text x="330" y="308" text-anchor="middle" font-size="13" fill="light-dark(#0f766e, #5eead4)" font-weight="700">serverless is cheaper here</text>
    <text x="330" y="326" text-anchor="middle" font-size="11" fill="var(--diagram-muted, #9a9aa6)">most people building this are here</text>

    <text x="930" y="352" text-anchor="middle" font-size="13" fill="light-dark(#5b3fd8, #a78bfa)" font-weight="700">the cluster is cheaper here</text>
    <text x="930" y="372" text-anchor="middle" font-size="11" fill="var(--diagram-muted, #9a9aa6)">and only here, on this axis alone</text>

    <text x="690" y="120" text-anchor="middle" font-size="11" fill="light-dark(#b45309, #fbbf24)">they cross somewhere in here</text>
    <text x="690" y="136" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #6c6c68)">a band, not a point: euros and dollars</text>
    <text x="690" y="150" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #6c6c68)">are not converted here</text>

    <text x="48" y="510" font-size="12" fill="var(--diagram-muted, #6c6c68)">the flat line is doing other work too · the same EUR 122.45 carries ingress, certificates, GitOps, metrics, logs and traces for everything else on the cluster</text>
  </g>
</svg>
