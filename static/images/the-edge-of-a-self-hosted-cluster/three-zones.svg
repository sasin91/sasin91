<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="The edge as three trust zones. First, optional and drawn dashed, a proxying CDN that terminates TLS, after which the client address travels only as a header and the origin firewall must be locked to the CDN's ranges. Second, the provider load balancer, which terminates the connection and opens a new one, dropping the client address unless PROXY protocol is enabled. Third, inside the cluster, two Traefik replicas on separate nodes behind one platform-owned Gateway with an HTTP listener restricted to its own namespace and an HTTPS listener whose allowedRoutes selector admits tenant namespaces, with cert-manager issuing into a secret both replicas read. A long-lived websocket is drawn crossing all three zones as a single connection.">
  <defs>
    <style>svg:root { color-scheme: dark; }</style>
    <linearGradient id="e-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--diagram-bg, #12121b)"/>
      <stop offset="100%" stop-color="var(--diagram-panel, #0a0a10)"/>
    </linearGradient>
    <marker id="e-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="light-dark(#0f766e, #5eead4)"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="24" fill="url(#e-panel)"/>
  <rect x="0.5" y="0.5" width="1199" height="619" rx="24" fill="none" stroke="var(--diagram-rule, #ffffff)" stroke-opacity="0.08"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="48" y="44" font-size="16" fill="var(--diagram-muted, #9a9aa6)">three zones · every boundary is somewhere the client address can be lost</text>

    <rect x="48" y="80" width="272" height="330" rx="12" fill="none" stroke="var(--diagram-rule, #4b5563)" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="70" y="108" font-size="13" fill="var(--diagram-muted, #9a9aa6)">zone 1 · optional</text>
    <rect x="70" y="126" width="228" height="72" rx="10" fill="var(--diagram-panel, #1b1b26)" stroke="light-dark(#b45309, #fbbf24)" stroke-width="1.5"/>
    <text x="184" y="154" text-anchor="middle" font-size="14" fill="light-dark(#b45309, #fbbf24)" font-weight="700">proxying CDN</text>
    <text x="184" y="174" text-anchor="middle" font-size="11" fill="var(--diagram-muted, #9a9aa6)">terminates TLS</text>
    <text x="184" y="190" text-anchor="middle" font-size="11" fill="var(--diagram-muted, #9a9aa6)">absorbs the flood</text>
    <text x="70" y="228" font-size="11" fill="light-dark(#b45309, #fbbf24)">what it costs you:</text>
    <text x="70" y="250" font-size="11" fill="var(--diagram-muted, #9a9aa6)">the client address is now a header</text>
    <text x="70" y="268" font-size="11" fill="var(--diagram-muted, #9a9aa6)">and a header can be forged</text>
    <text x="70" y="292" font-size="11" fill="var(--diagram-muted, #9a9aa6)">so the origin firewall must accept</text>
    <text x="70" y="310" font-size="11" fill="var(--diagram-muted, #9a9aa6)">only the CDN's ranges</text>
    <text x="70" y="340" font-size="11" fill="var(--diagram-muted, #6c6c68)">those are one control, not two:</text>
    <text x="70" y="358" font-size="11" fill="var(--diagram-muted, #6c6c68)">trusting the header without</text>
    <text x="70" y="376" font-size="11" fill="var(--diagram-muted, #6c6c68)">locking the origin is worse than</text>
    <text x="70" y="394" font-size="11" fill="var(--diagram-muted, #6c6c68)">doing neither</text>

    <rect x="352" y="80" width="252" height="330" rx="12" fill="none" stroke="var(--diagram-rule, #2b2b36)" stroke-width="1.5"/>
    <text x="374" y="108" font-size="13" fill="var(--diagram-muted, #9a9aa6)">zone 2 · the provider</text>
    <rect x="374" y="126" width="208" height="72" rx="10" fill="var(--diagram-panel, #1b1b26)" stroke="light-dark(#0f766e, #5eead4)" stroke-width="1.5"/>
    <text x="478" y="154" text-anchor="middle" font-size="14" fill="light-dark(#0f766e, #5eead4)" font-weight="700">load balancer</text>
    <text x="478" y="174" text-anchor="middle" font-size="11" fill="var(--diagram-muted, #9a9aa6)">terminates the connection</text>
    <text x="478" y="190" text-anchor="middle" font-size="11" fill="var(--diagram-muted, #9a9aa6)">and opens a new one</text>
    <text x="374" y="228" font-size="11" fill="light-dark(#0f766e, #5eead4)">this is where the address goes</text>
    <text x="374" y="250" font-size="11" fill="var(--diagram-muted, #9a9aa6)">every request now appears to come</text>
    <text x="374" y="268" font-size="11" fill="var(--diagram-muted, #9a9aa6)">from the balancer</text>
    <text x="374" y="292" font-size="11" fill="var(--diagram-muted, #9a9aa6)">rate limits and abuse rules that</text>
    <text x="374" y="310" font-size="11" fill="var(--diagram-muted, #9a9aa6)">key on it are limiting one client</text>
    <text x="374" y="340" font-size="11" fill="var(--diagram-muted, #6c6c68)">PROXY protocol carries it across,</text>
    <text x="374" y="358" font-size="11" fill="var(--diagram-muted, #6c6c68)">and the kit ships it commented</text>
    <text x="374" y="376" font-size="11" fill="var(--diagram-muted, #6c6c68)">out, with a warning above it</text>

    <rect x="636" y="80" width="516" height="330" rx="12" fill="none" stroke="light-dark(#5b3fd8, #a78bfa)" stroke-width="1.5"/>
    <text x="658" y="108" font-size="13" fill="light-dark(#5b3fd8, #a78bfa)">zone 3 · the cluster</text>

    <rect x="658" y="126" width="220" height="60" rx="10" fill="none" stroke="var(--diagram-rule, #4b5563)" stroke-width="1.5"/>
    <text x="768" y="150" text-anchor="middle" font-size="13" fill="var(--diagram-text, #e8e8e4)">traefik · node A</text>
    <text x="768" y="170" text-anchor="middle" font-size="11" fill="var(--diagram-muted, #9a9aa6)">replica 1</text>
    <rect x="658" y="198" width="220" height="60" rx="10" fill="none" stroke="var(--diagram-rule, #4b5563)" stroke-width="1.5"/>
    <text x="768" y="222" text-anchor="middle" font-size="13" fill="var(--diagram-text, #e8e8e4)">traefik · node B</text>
    <text x="768" y="242" text-anchor="middle" font-size="11" fill="var(--diagram-muted, #9a9aa6)">replica 2</text>
    <text x="658" y="280" font-size="11" fill="var(--diagram-muted, #6c6c68)">required anti-affinity · PDB minAvailable 1</text>

    <rect x="902" y="126" width="228" height="132" rx="10" fill="var(--diagram-panel, #1b1b26)" stroke="light-dark(#5b3fd8, #a78bfa)" stroke-width="1.5"/>
    <text x="1016" y="150" text-anchor="middle" font-size="13" fill="light-dark(#5b3fd8, #a78bfa)" font-weight="700">the Gateway</text>
    <text x="1016" y="174" text-anchor="middle" font-size="11" fill="var(--diagram-text, #e8e8e4)">:80 same namespace only</text>
    <text x="1016" y="190" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #9a9aa6)">redirect · ACME challenge</text>
    <text x="1016" y="216" text-anchor="middle" font-size="11" fill="var(--diagram-text, #e8e8e4)">:443 allowedRoutes selector</text>
    <text x="1016" y="232" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #9a9aa6)">admits tenant namespaces</text>
    <text x="1016" y="250" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #6c6c68)">attachment, not references</text>

    <rect x="902" y="278" width="228" height="56" rx="10" fill="none" stroke="var(--diagram-rule, #4b5563)" stroke-width="1.5"/>
    <text x="1016" y="300" text-anchor="middle" font-size="12" fill="var(--diagram-text, #e8e8e4)">cert-manager</text>
    <text x="1016" y="318" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #9a9aa6)">the only ACME client · one Secret</text>
    <path d="M 1016 274 V 262" fill="none" stroke="var(--diagram-rule, #6b7280)" stroke-width="1.2"/>
    <path d="M 896 156 H 884" fill="none" stroke="var(--diagram-rule, #6b7280)" stroke-width="1.2"/>
    <path d="M 896 228 H 884" fill="none" stroke="var(--diagram-rule, #6b7280)" stroke-width="1.2"/>
    <text x="658" y="376" font-size="11" fill="var(--diagram-muted, #6c6c68)">the ingress runs two replicas because it runs no ACME client</text>

    <path d="M 322 156 H 346" fill="none" stroke="light-dark(#0f766e, #5eead4)" stroke-width="1.5" marker-end="url(#e-a)"/>
    <path d="M 606 156 H 630" fill="none" stroke="light-dark(#0f766e, #5eead4)" stroke-width="1.5" marker-end="url(#e-a)"/>

    <path d="M 70 470 H 1130" fill="none" stroke="light-dark(#b45309, #fbbf24)" stroke-width="2"/>
    <circle cx="70" cy="470" r="5" fill="light-dark(#b45309, #fbbf24)"/>
    <circle cx="1130" cy="470" r="5" fill="light-dark(#b45309, #fbbf24)"/>
    <text x="70" y="500" font-size="12" fill="light-dark(#b45309, #fbbf24)" font-weight="700">one websocket · a single connection held open across all three</text>
    <text x="70" y="522" font-size="11" fill="var(--diagram-muted, #9a9aa6)">every zone has its own idle timer, and the shortest one wins</text>
    <text x="70" y="542" font-size="11" fill="var(--diagram-muted, #9a9aa6)">a heartbeat defends against all of them · a raised timeout only against the ones you configured</text>
    <text x="70" y="570" font-size="11" fill="var(--diagram-muted, #6c6c68)">a rolling deployment cuts it too, which is what the disruption budget and the grace period are for</text>
  </g>
</svg>
