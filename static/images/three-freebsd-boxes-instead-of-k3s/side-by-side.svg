<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Two columns at equal width. Left, three FreeBSD boxes behind a load balancer: each box runs pf and Caddy over a shared kernel with two or three jails inside, and a dashed line links the three at the address level, labelled as something you build yourself. Right, three k3s nodes behind the same load balancer, overlaid by one shaded block spanning all of them labelled platform, 4,526 mebibytes and 81 custom resource definitions, with the application drawn to scale inside it as an eight mebibyte square. Beneath: about thirty euros a month against one hundred and twenty two.">
  <defs>
    <style>svg:root { color-scheme: dark; }</style>
    <linearGradient id="f-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--diagram-bg, #12121b)"/>
      <stop offset="100%" stop-color="var(--diagram-panel, #0a0a10)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="660" rx="24" fill="url(#f-panel)"/>
  <rect x="0.5" y="0.5" width="1199" height="659" rx="24" fill="none" stroke="var(--diagram-rule, #ffffff)" stroke-opacity="0.08"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="48" y="44" font-size="16" fill="var(--diagram-muted, #9a9aa6)">same three machines · same load balancer · the difference is what runs before your code does</text>

    <text x="90" y="86" font-size="15" fill="light-dark(#0f766e, #5eead4)" font-weight="700">three FreeBSD boxes</text>
    <text x="650" y="86" font-size="15" fill="light-dark(#5b3fd8, #a78bfa)" font-weight="700">three k3s nodes</text>

    <rect x="90" y="102" width="460" height="44" rx="10" fill="none" stroke="var(--diagram-rule, #4b5563)" stroke-width="1.5"/>
    <text x="320" y="130" text-anchor="middle" font-size="13" fill="var(--diagram-text, #e8e8e4)">load balancer</text>
    <rect x="650" y="102" width="460" height="44" rx="10" fill="none" stroke="var(--diagram-rule, #4b5563)" stroke-width="1.5"/>
    <text x="880" y="130" text-anchor="middle" font-size="13" fill="var(--diagram-text, #e8e8e4)">load balancer</text>

    <g stroke="light-dark(#0f766e, #5eead4)" stroke-width="1.5" fill="none">
      <rect x="90" y="176" width="460" height="104" rx="10"/>
      <rect x="90" y="300" width="460" height="104" rx="10"/>
      <rect x="90" y="424" width="460" height="104" rx="10"/>
    </g>

    <g font-size="11" fill="var(--diagram-muted, #9a9aa6)">
      <text x="106" y="196">pf · Caddy</text>
      <text x="106" y="320">pf · Caddy</text>
      <text x="106" y="444">pf · Caddy</text>
    </g>

    <g fill="none" stroke="var(--diagram-rule, #4b5563)" stroke-width="1.2">
      <rect x="106" y="206" width="132" height="38" rx="6"/><rect x="250" y="206" width="132" height="38" rx="6"/><rect x="394" y="206" width="132" height="38" rx="6"/>
      <rect x="106" y="330" width="132" height="38" rx="6"/><rect x="250" y="330" width="132" height="38" rx="6"/><rect x="394" y="330" width="132" height="38" rx="6"/>
      <rect x="106" y="454" width="132" height="38" rx="6"/><rect x="250" y="454" width="132" height="38" rx="6"/><rect x="394" y="454" width="132" height="38" rx="6"/>
    </g>
    <g font-size="10" fill="var(--diagram-text, #e8e8e4)" text-anchor="middle">
      <text x="172" y="230">jail</text><text x="316" y="230">jail</text><text x="460" y="230">jail</text>
      <text x="172" y="354">jail</text><text x="316" y="354">jail</text><text x="460" y="354">jail</text>
      <text x="172" y="478">jail</text><text x="316" y="478">jail</text><text x="460" y="478">jail</text>
    </g>

    <g fill="light-dark(#0f766e, #5eead4)" fill-opacity="0.16">
      <rect x="106" y="252" width="420" height="16" rx="4"/>
      <rect x="106" y="376" width="420" height="16" rx="4"/>
      <rect x="106" y="500" width="420" height="16" rx="4"/>
    </g>
    <g font-size="9" fill="var(--diagram-muted, #6c6c68)" text-anchor="middle">
      <text x="316" y="264">one shared kernel</text>
      <text x="316" y="388">one shared kernel</text>
      <text x="316" y="512">one shared kernel</text>
    </g>

    <path d="M 66 228 V 476" fill="none" stroke="light-dark(#0f766e, #5eead4)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="58" y="352" font-size="10" fill="light-dark(#0f766e, #5eead4)" transform="rotate(-90 58 352)" text-anchor="middle">CARP · you build this</text>

    <g stroke="var(--diagram-rule, #4b5563)" stroke-width="1.5" fill="none">
      <rect x="650" y="176" width="460" height="104" rx="10"/>
      <rect x="650" y="300" width="460" height="104" rx="10"/>
      <rect x="650" y="424" width="460" height="104" rx="10"/>
    </g>

    <rect x="666" y="192" width="428" height="320" rx="8" fill="light-dark(#5b3fd8, #a78bfa)" fill-opacity="0.17" stroke="light-dark(#5b3fd8, #a78bfa)" stroke-width="1.5"/>
    <text x="880" y="330" text-anchor="middle" font-size="15" fill="light-dark(#5b3fd8, #a78bfa)" font-weight="700">platform</text>
    <text x="880" y="352" text-anchor="middle" font-size="12" fill="var(--diagram-text, #e8e8e4)">4,526 Mi · 81 CRDs</text>
    <text x="880" y="372" text-anchor="middle" font-size="11" fill="var(--diagram-muted, #9a9aa6)">before anything of yours runs</text>

    <rect x="874" y="404" width="12" height="12" rx="2" fill="light-dark(#b45309, #fbbf24)"/>
    <path d="M 880 420 V 436" fill="none" stroke="light-dark(#b45309, #fbbf24)" stroke-width="1"/>
    <text x="880" y="452" text-anchor="middle" font-size="12" fill="light-dark(#b45309, #fbbf24)" font-weight="700">the application</text>
    <text x="880" y="470" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #9a9aa6)">8 Mi · drawn to scale</text>

    <rect x="90" y="558" width="460" height="52" rx="10" fill="none" stroke="var(--diagram-rule, #2b2b36)" stroke-width="1"/>
    <text x="320" y="580" text-anchor="middle" font-size="15" fill="light-dark(#0f766e, #5eead4)" font-weight="700">about EUR 30 a month *</text>
    <text x="320" y="599" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #6c6c68)">* three CX23 plus the load balancer, approximate</text>

    <rect x="650" y="558" width="460" height="52" rx="10" fill="none" stroke="var(--diagram-rule, #2b2b36)" stroke-width="1"/>
    <text x="880" y="580" text-anchor="middle" font-size="15" fill="light-dark(#5b3fd8, #a78bfa)" font-weight="700">EUR 122.45 a month</text>
    <text x="880" y="599" text-anchor="middle" font-size="10" fill="var(--diagram-muted, #6c6c68)">measured · the same three machines cost the same</text>

    <text x="48" y="640" font-size="11" fill="var(--diagram-muted, #6c6c68)">the price gap is not FreeBSD · it is that the jails fit in 4 GB and the nodes do not</text>
  </g>
</svg>
