<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ cv.site.name }}{% endblock %}</title>
    {% block description %}{% endblock %}
    <link rel="icon" href="/favicon.png" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/site.css" />
    <link rel="stylesheet" href="/syntax.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ cv.site.name }}" href="/rss.xml" />
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="wrap">
      <header class="site-head">
        <a class="brand" href="/">{{ cv.site.name }}</a>
        <nav class="site-nav" aria-label="Main">
          <a href="/blog/">Writing</a>
          <a href="/about/">About</a>
          <a href="/cv/">CV</a>
          <a href="{{ cv.site.links.github }}">GitHub</a>
          <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">
            Dark theme
          </button>
        </nav>
      </header>

      <main id="content" tabindex="-1">
        {% block content %}{% endblock %}
      </main>

      <footer class="site-foot">
        <span>&copy; {{ year }} {{ cv.site.name }}</span>
        <nav class="site-foot-links" aria-label="Projects">
          <a href="https://athletos.app">AthletOS</a>
        </nav>
        <a href="/rss.xml">RSS</a>
      </footer>
    </div>
    <script>
      (function () {
        var button = document.getElementById('theme-toggle');
        if (!button) return;
        var root = document.documentElement;

        function current() {
          return root.dataset.theme ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }

        function sync() {
          button.setAttribute('aria-pressed', String(current() === 'dark'));
        }

        sync();

        button.addEventListener('click', function () {
          var next = current() === 'dark' ? 'light' : 'dark';

          function apply() {
            root.dataset.theme = next;
            try { localStorage.setItem('theme', next); } catch (e) {}
            sync();
          }

          // Same-document view transition: the crossfade of a page transition
          // without the reload, so scroll position needs no handling at all.
          if (document.startViewTransition &&
              !matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.startViewTransition(apply);
          } else {
            apply();
          }
        });
      })();
    </script>
  </body>
</html>
